<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas</title>
</head>

<body>

    <h1>Gerenciador de Tarefas</h1>

    <h2>Adicionar tarefa</h2>

    <form action="/adicionar" method="POST">

        <label for="titulo">
            Título:
        </label>

        <input
            type="text"
            id="titulo"
            name="titulo"
            placeholder="Digite uma tarefa"
            required
        >

        <br><br>

        <label for="prioridade">
            Prioridade:
        </label>

        <select
            id="prioridade"
            name="prioridade"
        >

            <option value="Alta">
                Alta
            </option>

            <option value="Média" selected>
                Média
            </option>

            <option value="Baixa">
                Baixa
            </option>

        </select>

        <br><br>

        <button type="submit">
            Adicionar tarefa
        </button>

    </form>


    <hr>


    <h2>Minhas tarefas</h2>

    {% if tarefas %}

        {% for tarefa in tarefas %}

            <div>

                <strong>
                    {{ tarefa.titulo }}
                </strong>

                <br>

                Prioridade:

                {{ tarefa.prioridade }}

                <br><br>

                <a href="/editar/{{ tarefa.id }}">
                    Editar
                </a>

                &nbsp; | &nbsp;

                <a href="/excluir/{{ tarefa.id }}">
                    Excluir
                </a>

            </div>

            <hr>

        {% endfor %}

    {% else %}

        <p>
            Nenhuma tarefa cadastrada.
        </p>

    {% endif %}

</body>

</html>
