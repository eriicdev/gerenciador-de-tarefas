<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar Tarefa</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;

            background-color: #2563eb;
            color: white;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: #555;
            text-decoration: none;
        }

        .voltar:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <h1>Editar tarefa</h1>

        <form method="POST">

            <label for="titulo">
                Título da tarefa
            </label>

            <input
                type="text"
                id="titulo"
                name="titulo"
                value="{{ tarefa.titulo }}"
                required
            >


            <label for="prioridade">
                Prioridade
            </label>

            <select
                id="prioridade"
                name="prioridade"
            >

                <option
                    value="Alta"
                    {% if tarefa.prioridade == "Alta" %}selected{% endif %}
                >
                    Alta
                </option>

                <option
                    value="Média"
                    {% if tarefa.prioridade == "Média" %}selected{% endif %}
                >
                    Média
                </option>

                <option
                    value="Baixa"
                    {% if tarefa.prioridade == "Baixa" %}selected{% endif %}
                >
                    Baixa
                </option>

            </select>


            <button type="submit">
                Salvar alteração
            </button>

        </form>


        <a
            href="/"
            class="voltar"
        >
            ← Voltar para tarefas
        </a>

    </div>

</div>

</body>

</html>
